<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="shortcut icon" href="/favicon.png" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="/p2p.css" />
    <title>视频通话</title>
</head>
<body>
	<div id="container">
		<div class="video-box">
			<div id="time_counter">00:00:00</div>
			<video id="remote-video"></video>
			<video id="local-video" muted></video>
			<div class="logger"></div>
		</div>

		<div class="controls-bar">
			<button class="start-button" onclick="startLive()">开始</button>
			<button class="stop-button"  onclick="stopPeerConnection()">结束</button>
			<select id="cameraSelect"></select> 
			<select id="audioInputSelect"></select> 
		</div>
	</div>

    
    <script src='/p2p.js' charset='utf-8'></script>


    </body>
</html>
